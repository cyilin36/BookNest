services:
  postgres:
    image: postgres:17-alpine
    container_name: book-reader-test-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: book_reader
      POSTGRES_USER: book_reader
      POSTGRES_PASSWORD: book_reader_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "15432:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U book_reader -d book_reader"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../backend
    container_name: book-reader-test-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_DSN: postgres://book_reader:book_reader_password@postgres:5432/book_reader?sslmode=disable
      DATA_DIR: /data
      BOOKS_DIR: /data/books
      COVERS_DIR: /data/covers
      TEMP_DIR: /data/temp
      HTTP_ADDR: :8080
      JWT_SECRET: test-only-change-me
    ports:
      - "8080:8080"
    volumes:
      - ./backend-data:/data
